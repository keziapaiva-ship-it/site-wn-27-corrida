<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>solicite sua viagem</title>

  <link rel="stylesheet" href="/css/solicitar.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Isso vai forçar o fundo por cima de qualquer outro arquivo CSS */
  body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100% !important;
    min-height: 100vh !important;
    
    /* O gradiente rosa animado */
    background: linear-gradient(-45deg, #FF2D78, #f5a0c2, #ec9cbd, #ce587f) !important;
    background-size: 400% 400% !important;
    
    /* A animação */
    animation: gradientMove 10s ease infinite !important;
    
    /* Garante que o fundo não role */
    background-attachment: fixed !important;
  }

  @keyframes gradientMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
</style>
</head>

<body class="meu-fundo-animado"></body>

  <!-- NAV -->
  <nav>
    <div class="logo">WN</div>
    <ul class="nav-links">
      <li><a href="/html/solicitar.html">viajar</a></li>
      <li><a href="/html/corrida.html">atividade</a></li>
      <li><a href="/html/login.html">entrar</a></li>
    </ul>
    <button class="btn-nav">
      <a href="/html/cadastro.html">cadastre-se</a>
    </button>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h1>Va para qualquer lugar<br /><em>com o app WN</em></h1>
    <p>Escolha o veículo perfeito, calcule sua rota e chegue com estilo.</p>
  </section>

  <!-- CARD -->
  <div class="route-card">

    <div class="input-group">
      <input id="origem" placeholder="Sua localização">
      <button class="btn-loc" onclick="pegarGPS()">📍</button>
    </div>

    <div class="input-group">
      <input id="destino" placeholder="Para onde você vai?" oninput="buscarSugestoes(this.value)">
    </div>

    <ul id="sugestoes"></ul>

    <button class="btn-calc" onclick="solicitarCorrida()">
      Solicitar corrida
    </button>

  </div>

  <!-- SCRIPT -->
  <script>

    // 🧪 TESTE API (opcional)
    fetch("https://nominatim.openstreetmap.org/search?format=json&q=Curitiba&limit=1")
      .then(r => r.json())
      .then(d => console.log("API OK:", d))
      .catch(e => console.log("ERRO API:", e));

    // 📍 GPS
    function pegarGPS() {
      navigator.geolocation.getCurrentPosition(async (pos) => {
        try {
          const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${pos.coords.latitude}&lon=${pos.coords.longitude}`;

          const res = await fetch(url);
          const data = await res.json();

          document.getElementById("origem").value =
            data.display_name || "Local não encontrado";

        } catch (e) {
          console.log(e);
          alert("Erro GPS");
        }
      });
    }

    // 🔍 sugestões
    async function buscarSugestoes(texto) {
      if (texto.length < 3) return;

      try {
        const res = await fetch(
          `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(texto)}&limit=5&countrycodes=br`
        );

        const data = await res.json();

        const lista = document.getElementById("sugestoes");
        lista.innerHTML = "";

        if (!data.length) return;

        data.forEach(item => {
          const li = document.createElement("li");
          li.innerText = item.display_name;

          li.onclick = () => {
            document.getElementById("destino").value = item.display_name;
            lista.innerHTML = "";
          };

          lista.appendChild(li);
        });

      } catch (e) {
        console.log("Erro API:", e);
      }
    }

    // 🚗 enviar corrida
    function solicitarCorrida() {
      const origem = document.getElementById("origem").value;
      const destino = document.getElementById("destino").value;

      if (!origem || !destino) {
        alert("Preencha tudo");
        return;
      }

      localStorage.setItem("origem", origem);
      localStorage.setItem("destino", destino);

      window.location.href = "/html/corrida.html";
    }

  </script>

</body>
</html>
