<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>solicite sua viagem</title>

  <link rel="stylesheet" href="/css/solicitar.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
</head>

<body style="background: linear-gradient(135deg, #ec9cbd, #f5a0c2); margin:0;">

  <!-- NAV -->
  <nav>
    <div class="logo">WN</div>
    <ul class="nav-links">
      <li><a href="/html/solicitar.html">viajar</a></li>
      <li><a href="/html/corrida.html">atividade</a></li>
      <li><a href="/html/login.html">entrar</a></li>
    </ul>
    <button class="btn-nav">
      <a href="/html/cadastro.html">cadastre-se</a>
    </button>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <h1>Va para qualquer lugar<br /><em>com o app WN</em></h1>
    <p>Escolha o veículo perfeito, calcule sua rota e chegue com estilo.</p>
  </section>

  <!-- CARD -->
  <div class="route-card">

    <div class="input-group">
      <input id="origem" placeholder="Sua localização">
      <button class="btn-loc" onclick="pegarGPS()">📍</button>
    </div>

    <div class="input-group">
      <input id="destino" placeholder="Para onde você vai?" oninput="buscarSugestoes(this.value)">
    </div>

    <ul id="sugestoes"></ul>

    <button class="btn-calc" onclick="irPagamento()">
      Solicitar corrida
    </button>
    <input id="destino" placeholder="Digite o destino">



  </div>

<script src="/javascript/solicita.js"></script>
