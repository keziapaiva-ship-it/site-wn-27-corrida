<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>solicite sua viagem</title>
  <link rel="stylesheet" href="/css/corrida.css">
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
</head>

<body>

  <!-- ══ NAV ══════════════════════════════════════ -->
  <nav>
    <div class="logo">WN</div>
    <ul class="nav-links">
      <li><a href="/html/solicitar.html">viajar</a></li>
      <li><a href="/html/corrida.html">atividade</a></li>
      <li><a href="/html/login.html">entrar</a></li>
    </ul>
    <button class="btn-nav">cadastre-se</button>
  </nav>
</body>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<div id="map" style="height: 400px;"></div>
<p id="tempo"></p>

<div class="payment-card">
    <p class="route-label" style="margin-bottom: 12px; font-size: 0.7rem; text-align: left;">PAGAMENTO</p>
    
    <label class="payment-option">
        <input type="radio" name="pagamento" value="pix" checked>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--pink)" stroke-width="2">
            <path d="M12 2L2 12l10 10 10-10L12 2z"></path>
        </svg>
        <span>Pix</span>
    </label>

    <label class="payment-option">
        <input type="radio" name="pagamento" value="cartao">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--pink-light)" stroke-width="2">
            <rect x="2" y="5" width="20" height="14" rx="2"></rect>
            <line x1="2" y1="10" x2="22" y2="10"></line>
        </svg>
        <span>Cartão</span>
    </label>

    <label class="payment-option">
        <input type="radio" name="pagamento" value="dinheiro">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2">
            <rect x="2" y="6" width="20" height="12" rx="2"></rect>
            <circle cx="12" cy="12" r="2"></circle>
        </svg>
        <span>Dinheiro</span>
    </label>

    <button class="btn-calc btn-concluir" onclick="alert('Corrida Solicitada!')">Concluir</button>
</div>

    <div class="bottom-panel">
        <div class="bottom-header">
            <h3 class="bottom-title">Escolha seu <span>WN</span></h3>
            <div class="sort-pills">
              <link src=""
                <button class="pill active">Mais baratos</button>
                <button class="pill">Premium</button>
            </div>
        </div>

        <div class="cars-track">
            <div class="car-card selected" onclick="selectCar(this)">
                <svg class="car-img-svg" viewBox="0 0 100 100" fill="#FF2D78">
                    <path d="M90,45c-2-5-8-10-15-11c-2-7-8-16-18-20c-11-4-22-3-29,1c-9,4-15,15-17,25c-1,5,0,11,2,16c1,3,4,5,7,6c1,1,2,1,3,1h5 c1,5,6,9,11,9s10-4,11-9h18c1,5,6,9,11,9s10-4,11-9h5c1,0,1-1,1-1c3-1,6-3,7-6C91,52,91,48,90,45z M32,73c-4,0-7-3-7-7s3-7,7-7 s7,3,7,7S36,73,32,73z M68,73c-4,0-7-3-7-7s3-7,7-7s7,3,7,7S72,73,68,73z"/>
                </svg>
                <p class="car-name">WN Comum</p>
                <div class="car-price"><span class="currency">R$</span> <span class="amount">14,50</span></div>
            </div>

            <div class="car-card" onclick="selectCar(this)">
                <svg class="car-img-svg" viewBox="0 0 100 100" fill="#FF2D78">
                    <path d="M92,50c-2-6-10-10-17-12c-2-8-9-15-18-18c-10-3-20-2-27,2c-9,5-14,15-15,25c-1,6,1,11,3,15c2,3,5,6,8,6c1,1,2,1,2,1h6 c1,5,6,9,11,9s10-4,11-9h15c1,5,6,9,11,9s10-4,11-9h5c1,0,2-1,2-1c3-1,6-3,7-6C93,57,93,53,92,50z M33,75c-4,0-7-3-7-7s3-7,7-7 s7,3,7,7S37,75,33,75z M69,75c-4,0-7-3-7-7s3-7,7-7s7,3,7,7S73,75,69,75z"/>
                </svg>
                <p class="car-name">WN Comfort</p>
                <div class="car-price"><span class="currency">R$</span> <span class="amount">19,80</span></div>
            </div>

            <div class="car-card" onclick="selectCar(this)">
                <svg class="car-img-svg" viewBox="0 0 100 100" fill="#FF2D78">
                    <path d="M95,55c-2-8-12-14-22-16c-3-10-12-18-24-20c-15-2-30,2-38,10c-8,8-12,20-10,32c1,6,4,12,8,16c1,1,2,2,3,2h7 c1,6,7,10,14,10s13-4,14-10h12c1,6,7,10,14,10s13-4,14-10h8c1,0,1,0,2-1c2,0,4-1,6-3C96,65,96,60,95,55z"/>
                </svg>
                <p class="car-name">WN Fusca</p>
                <div class="car-price"><span class="currency">R$</span> <span class="amount">25,00</span></div>
            </div>

            <div class="car-card" onclick="selectCar(this)">
                <svg class="car-img-svg" viewBox="0 0 24 24" fill="#FF2D78">
                    <path d="M19,9h-1.22c-0.42-1.67-1.93-3-3.78-3s-3.36,1.33-3.78,3H5c-2.8,0-5,2.2-5,5v2c0,1.1,0.9,2,2,2h1.22 c0.42,1.67,1.93,3,3.78,3s3.36-1.33,3.78-3h4.44c0.42,1.67,1.93,3,3.78,3s3.36-1.33,3.78-3H22v-6C22,10.1,20.66,9,19,9z"/>
                </svg>
                <p class="car-name">WN Black</p>
                <div class="car-price"><span class="currency">R$</span> <span class="amount">32,90</span></div>
            </div>
        </div>
    </div>

    <script>
        function selectCar(element) {
            // Remove seleção de todos
            document.querySelectorAll('.car-card').forEach(card => {
                card.classList.remove('selected');
            });
            // Adiciona no clicado
            element.classList.add('selected');
        }
    </script>

</body>

</div>
<script src="/javascript/corrida.js"></script>

</body>

</html>
